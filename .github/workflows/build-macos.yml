# macOS용 앱(.app, .dmg)과 명령줄 도구를 GitHub 서버에서 빌드합니다.
# 사용: GitHub 저장소 → Actions 탭 → "Build macOS" → Run workflow
#       완료 후 실행 결과 페이지 하단 Artifacts의 "connected-macos" 다운로드
# 태그(v*)를 푸시하면 자동 실행되고, 같은 이름 Release에 파일이 첨부됩니다. test-* 태그는 시험판입니다.
# macOS 러너는 분 단가가 높아서, 푸시마다 돌리지 않고 수동 실행과 태그에서만 돌립니다.
name: Build macOS

on:
  workflow_dispatch:
  push:
    tags: ["v*", "test-*"]

permissions:
  contents: write   # 태그 푸시 시 Release 생성에 필요

jobs:
  build:
    runs-on: macos-latest   # GitHub 호스트 러너 (Apple 실리콘)
    timeout-minutes: 60
    steps:
      - name: 소스 받기
        uses: actions/checkout@v4

      - name: Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: 화면 로직 테스트
        run: bun run test

      - name: 단위·통합 테스트 (Rust)
        run: cargo test --workspace

      - name: Tauri 빌드 (.app, .dmg)
        run: bun run --cwd crates/connected-desktop tauri build --bundles app,dmg

      - name: 명령줄 도구 빌드
        run: cargo build --release -p connected-cli

      - name: 산출물 이름 고정
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/release/bundle/macos/Connected.app dist/Connected-macos.zip
          cp target/release/bundle/dmg/*.dmg dist/Connected-macos.dmg
          cp target/release/connected dist/connected-cli-macos
          shasum -a 256 dist/*
          ls -la dist/

      - name: 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: connected-macos
          if-no-files-found: error
          path: dist/*

      - name: Release에 첨부 (태그 푸시일 때만, test-* 는 시험판으로)
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/test-')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ startsWith(github.ref_name, 'test-') }}
          name: ${{ github.ref_name }}
          files: dist/*
