[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

connected-app = { path = "crates/connected-app" }
connected-core = { path = "crates/connected-core" }
connected-net = { path = "crates/connected-net" }
connected-platform = { path = "crates/connected-platform" }
connected-proto = { path = "crates/connected-proto" }
